name: Bug
description: Something does not work as expected
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        After creating the issue, set **Priority** and **Estimate (days)** in the right-hand panel.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, device, version, etc.
  - type: textarea
    id: errors
    attributes:
      label: Screenshots or error messages
      description: Paste the full error message. No secrets or client data.
