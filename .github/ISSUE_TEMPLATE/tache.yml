name: Task
description: A clear, achievable piece of work
type: Task
body:
  - type: markdown
    attributes:
      value: |
        After creating the issue, set **Priority** and **Estimate (days)** in the right-hand panel. If the estimate is above 2 days, split the task.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this work needed? Link the related decision or project.
    validations:
      required: true
  - type: textarea
    id: to-do
    attributes:
      label: What to do
      description: One issue = one clear piece of work. If it is too big, split it into several issues.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A verifiable list. The task is done when every box is checked.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues or decisions that must be finished first (optional).
